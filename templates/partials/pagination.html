{% if page.has_other_pages %}
  <nav class="pagination" aria-label="Sayfalar">
    {% if page.has_previous %}<a href="?sayfa={{ page.previous_page_number }}" rel="prev">← Daha yeni</a>{% endif %}
    <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="?sayfa={{ page.next_page_number }}" rel="next">Daha eski →</a>{% endif %}
  </nav>
{% endif %}
