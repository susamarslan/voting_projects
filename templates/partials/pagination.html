{% if page.has_other_pages %}
  <nav class="pagination" aria-label="Sayfalar">
    {% if page.has_previous %}<a href="?{% if sort %}sirala={{ sort }}&amp;{% endif %}sayfa={{ page.previous_page_number }}" rel="prev">← Önceki</a>{% endif %}
    <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="?{% if sort %}sirala={{ sort }}&amp;{% endif %}sayfa={{ page.next_page_number }}" rel="next">Sonraki →</a>{% endif %}
  </nav>
{% endif %}
