{% load poll_extras %}
<article class="poll-card" data-poll-id="{{ poll.pk }}">
  <p class="poll-meta">
    <span class="poll-author">@{{ poll.author.username }}</span>
    · <time datetime="{{ poll.created_at|date:'c' }}">{{ poll.created_at|relative_time }}</time>
  </p>
  <h2 class="poll-question"><a href="{{ poll.get_absolute_url }}">{{ poll.question }}</a></h2>
  {% include "polls/_poll_options.html" %}
  <p class="poll-total"><span class="total-count">{{ poll.total_votes }}</span> oy</p>
</article>
